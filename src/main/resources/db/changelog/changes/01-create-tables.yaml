databaseChangeLog:
  - changeSet:
      id: 01-create-teams
      author: your_name
      changes:
        - createTable:
            tableName: teams
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: commission
                  type: FLOAT
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

  - changeSet:
      id: 02-create-players
      author: your_name
      changes:
        - createTable:
            tableName: players
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: age
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: experience_months
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: team_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_players_team_id
            baseTableName: players
            baseColumnNames: team_id
            referencedTableName: teams
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 03-create-transfers
      author: your_name
      changes:
        - createTable:
            tableName: transfers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: player_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: from_team_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: to_team_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: commission
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: total_cost
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: transfer_amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_transfers_player_id
            baseTableName: transfers
            baseColumnNames: player_id
            referencedTableName: players
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_transfers_from_team_id
            baseTableName: transfers
            baseColumnNames: from_team_id
            referencedTableName: teams
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_transfers_to_team_id
            baseTableName: transfers
            baseColumnNames: to_team_id
            referencedTableName: teams
            referencedColumnNames: id
            onDelete: CASCADE
